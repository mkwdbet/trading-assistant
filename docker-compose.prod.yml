services:
  api:
    build: .
    env_file:
      - .env
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
      - ./strategies:/app/strategies:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  caddy:
    image: caddy:2-alpine
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

