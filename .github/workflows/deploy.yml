name: Test and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -q

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    env:
      AWS_DEPLOY_PATH: ${{ secrets.AWS_DEPLOY_PATH || '/home/ubuntu/trading-assistant' }}
      AWS_HOST: ${{ secrets.AWS_HOST }}
      AWS_SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
      AWS_USER: ${{ secrets.AWS_USER || 'ubuntu' }}

    steps:
      - name: Skip deployment when secrets are missing
        if: env.AWS_HOST == '' || env.AWS_SSH_PRIVATE_KEY == ''
        run: |
          echo "AWS_HOST or AWS_SSH_PRIVATE_KEY is missing. Tests passed, but deployment was skipped."

      - name: Configure SSH
        if: env.AWS_HOST != '' && env.AWS_SSH_PRIVATE_KEY != ''
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AWS_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$AWS_HOST" >> ~/.ssh/known_hosts

      - name: Pull latest code and restart stack
        if: env.AWS_HOST != '' && env.AWS_SSH_PRIVATE_KEY != ''
        run: |
          ssh -i ~/.ssh/deploy_key "$AWS_USER@$AWS_HOST" << EOF
            set -euo pipefail
            cd "$AWS_DEPLOY_PATH"
            git fetch origin main
            git reset --hard origin/main
            bash scripts/deploy_prod.sh
          EOF
