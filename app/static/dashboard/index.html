<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Long-Term Edge Radar</title>
    <link rel="stylesheet" href="/static/dashboard/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <div class="hero-copy">
          <p class="eyebrow">Long-term investing radar</p>
          <h1>Long-Term Edge Radar</h1>
          <p class="hero-subtitle">희귀한 장기 기술적 우위 구간만 조용히 감시합니다.</p>
        </div>
        <div class="hero-actions">
          <button id="evaluateNowButton" class="primary" type="button">Evaluate Now</button>
        </div>
      </header>

      <main>
        <section class="metrics" aria-label="summary">
          <article class="metric-card">
            <span>Active Rules</span>
            <strong id="activeRules">-</strong>
          </article>
          <article class="metric-card">
            <span>Total Signals</span>
            <strong id="totalSignals">-</strong>
          </article>
          <article class="metric-card">
            <span>Last 30 Days</span>
            <strong id="signals30d">-</strong>
          </article>
          <article class="metric-card">
            <span>Evaluator</span>
            <strong id="evaluatorStatus">-</strong>
          </article>
        </section>

        <section class="workspace">
          <section class="panel signal-board-panel">
            <div class="section-heading">
              <div>
                <p class="eyebrow">Signal Board</p>
                <h2>신호별 진행 상태</h2>
              </div>
            </div>

            <div id="signalBoard" class="signal-board">
              <div class="empty-card">감시 중인 신호를 불러오는 중입니다.</div>
            </div>
          </section>

          <aside class="side-panel">
            <section class="panel">
              <div class="section-heading compact">
                <p class="eyebrow">System</p>
                <h2>현재 상태</h2>
              </div>
              <dl class="status-list">
                <div>
                  <dt>Discord</dt>
                  <dd id="discordStatus">-</dd>
                </div>
                <div>
                  <dt>Mode</dt>
                  <dd id="productMode">-</dd>
                </div>
                <div>
                  <dt>Interval</dt>
                  <dd id="checkInterval">-</dd>
                </div>
                <div>
                  <dt>Next Action</dt>
                  <dd>채팅에서 아이디어 확정</dd>
                </div>
              </dl>
              <button id="sendTestAlertButton" class="secondary full-button" type="button">
                Send Test Alert
              </button>
              <p id="testAlertStatus" class="status-text left"></p>
              <form class="settings-form" id="discordSettingsForm">
                <label for="discordWebhookInput">Discord Webhook</label>
                <input
                  id="discordWebhookInput"
                  name="webhook_url"
                  type="password"
                  autocomplete="off"
                  placeholder="https://discord.com/api/webhooks/..."
                />
                <button class="secondary full-button" type="submit">Save Webhook</button>
                <p id="discordSettingsStatus" class="status-text left"></p>
              </form>
            </section>
          </aside>
        </section>

        <section class="panel">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Watchlist</p>
              <h2>저장된 장기 조건</h2>
            </div>
            <span id="evaluationResult" class="status-text"></span>
          </div>
          <div class="table-wrap">
            <table id="rulesTable"></table>
          </div>
        </section>

        <section class="panel">
          <div class="section-heading">
            <div>
              <p class="eyebrow">History</p>
              <h2>알림 이력</h2>
            </div>
          </div>
          <div class="table-wrap">
            <table id="signalsTable"></table>
          </div>
        </section>
      </main>
    </div>

    <script src="/static/dashboard/app.js"></script>
  </body>
</html>
